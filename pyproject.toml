[project]
name = "circuitmind"
version = "0.1.0"
description = "Deterministic electrical engineering design review and schematic analysis platform"
authors = [
    { name = "ronaldopickerin", email = "220242217+ronaldopickerin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "reportlab>=5.0.1",
]

[project.scripts]
circuitmind = "circuitmind.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
